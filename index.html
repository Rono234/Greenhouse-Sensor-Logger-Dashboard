<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenhouser Sensor Logger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="portal-header">
      <div class="header content">
        <div class="brand">
          <span class="brand-icon"></span>
          <h1>Greenhouse Sensor Logger</h1>
        </div>
        <p class="header-status">
          Active Logs <span class="badge-count" id="queue-count">0</span>
        </p>
      </div>
    </header>

    <!-- Main -->
    <main class="portal-container">
      <section class="panel form-panel"></section>
      <section class="panel records-panel"></section>
    </main>

    <!-- Footer -->
    <footer class="portal-footer">
        <p> 2026 Green House Sensor Logger CSI_3150</p>
    </footer>
  </body>
</html>
